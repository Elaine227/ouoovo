<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Heart Galaxy - Responsive</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height, scaleBase;
let heartParticles = [];
let galaxyParticles = [];
let angleY = 0;

const colors = ['#ff0a54', '#ff477e', '#ff7096', '#ff85a1', '#fbb1bd', '#ffffff'];

class Particle {
    constructor(x, y, z, color, size) {
        this.baseX = x;
        this.baseY = y;
        this.baseZ = z;
        this.color = color;
        this.size = size;
    }

    draw(rotY) {
        let cosY = Math.cos(rotY);
        let sinY = Math.sin(rotY);
        let xz = this.baseX * cosY - this.baseZ * sinY;
        let zz = this.baseX * sinY + this.baseZ * cosY;

        const perspective = 800;
        // 這裡的 400 也要隨螢幕大小微調
        const scale = perspective / (perspective + zz + perspective/2);
        const screenX = xz * scale + width / 2;
        const screenY = this.baseY * scale + height / 2;

        ctx.globalAlpha = Math.min(1, Math.max(0.1, scale * 0.9));
        ctx.fillStyle = this.color;
        ctx.beginPath();
        // 粒子大小隨螢幕比例縮放
        ctx.arc(screenX, screenY, this.size * scale * (scaleBase/10), 0, Math.PI * 2);
        ctx.fill();
    }
}

function init() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    
    // 計算縮放基準：根據螢幕寬度自動調整比例
    scaleBase = Math.min(width, height) / 100;
    
    heartParticles = [];
    galaxyParticles = [];

    // 1. 建立立體愛心 - 使用 scaleBase 讓大小自適應
    const r = scaleBase * 1.5; // 動態半徑
    for (let i = 0; i < 4000; i++) {
        let t = Math.random() * Math.PI * 2;
        let r_offset = Math.random() * 0.15 + 0.85; 
        
        let x = r * 16 * Math.pow(Math.sin(t), 3) * r_offset;
        let y = -r * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * r_offset;
        let z = (Math.random() - 0.5) * (scaleBase * 12) * Math.sin(t); 

        heartParticles.push(new Particle(x, y, z, colors[Math.floor(Math.random() * colors.length)], Math.random() * 1.8 + 0.5));
    }

    // 2. 建立底部星盤 - 位置也隨 scaleBase 變動
    for (let i = 0; i < 1200; i++) {
        let dist = Math.random() * (scaleBase * 40) + (scaleBase * 15);
        let deg = Math.random() * Math.PI * 2;
        galaxyParticles.push(new Particle(
            Math.cos(deg) * dist, 
            (scaleBase * 25) + (Math.random() - 0.5) * (scaleBase * 2), // 相對位置
            Math.sin(deg) * dist, 
            '#ffffff', 
            Math.random() * 0.8
        ));
    }
}

function drawEnglishText() {
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    
    // 文字位置改為相對比例：螢幕高度的 85% 位置
    const baseY = height * 0.85; 
    
    // 字體大小隨螢幕寬度縮放
    const fontSize = Math.max(14, scaleBase * 3);
    ctx.font = `300 ${fontSize}px 'Segoe UI', Roboto, Arial`;
    ctx.letterSpacing = "2px";
    ctx.fillText("HAPPY VALENTINE'S DAY", width / 2, baseY);
}

function animate() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
    ctx.fillRect(0, 0, width, height);
    ctx.globalCompositeOperation = 'lighter';

    angleY += 0.012;

    galaxyParticles.forEach(p => p.draw(angleY * 0.3));
    heartParticles.forEach(p => p.draw(-angleY));

    drawEnglishText();
    requestAnimationFrame(animate);
}

// 監聽螢幕旋轉或大小改變
window.addEventListener('resize', init);
init();
animate();
</script>
</body>
</html>
