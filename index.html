<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Heart Galaxy - Vivid Purple</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; cursor: pointer; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height, scaleBase;
let heartParticles = [];
let galaxyParticles = [];
let angleY = 0;

// 定義顏色組：紫色系已移除純白，增強飽和度
const colorThemes = [
    ['#ff0a54', '#ff477e', '#ff7096', '#ff85a1', '#fbb1bd', '#ffffff'], // 浪漫粉色系
    ['#da12ff', '#bd20ff', '#8e24ff', '#e0aaff', '#f2d5f8', '#ffc2ff']  // 強化紫色系 (移除純白，增加鮮豔紫)
];
let currentThemeIndex = 0;

class Particle {
    constructor(x, y, z, size) {
        this.baseX = x;
        this.baseY = y;
        this.baseZ = z;
        this.size = size;
        this.updateColor();
    }

    updateColor() {
        const theme = colorThemes[currentThemeIndex];
        this.color = theme[Math.floor(Math.random() * theme.length)];
    }

    draw(rotY) {
        let cosY = Math.cos(rotY);
        let sinY = Math.sin(rotY);
        let xz = this.baseX * cosY - this.baseZ * sinY;
        let zz = this.baseX * sinY + this.baseZ * cosY;

        const perspective = 800;
        const scale = perspective / (perspective + zz + perspective/2);
        const screenX = xz * scale + width / 2;
        const screenY = this.baseY * scale + height / 2;

        // 稍微提高透明度下限，讓紫色更紮實
        ctx.globalAlpha = Math.min(1, Math.max(0.2, scale * 0.9));
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(screenX, screenY, this.size * scale * (scaleBase/10), 0, Math.PI * 2);
        ctx.fill();
    }
}

function init() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    scaleBase = Math.min(width, height) / 100;
    
    heartParticles = [];
    galaxyParticles = [];

    const r = scaleBase * 1.5; 
    for (let i = 0; i < 4000; i++) {
        let t = Math.random() * Math.PI * 2;
        let r_offset = Math.random() * 0.15 + 0.85; 
        
        let x = r * 16 * Math.pow(Math.sin(t), 3) * r_offset;
        let y = -r * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * r_offset;
        let z = (Math.random() - 0.5) * (scaleBase * 12) * Math.sin(t); 

        heartParticles.push(new Particle(x, y, z, Math.random() * 1.8 + 0.5));
    }

    for (let i = 0; i < 1200; i++) {
        let dist = Math.random() * (scaleBase * 40) + (scaleBase * 15);
        let deg = Math.random() * Math.PI * 2;
        galaxyParticles.push(new Particle(
            Math.cos(deg) * dist, 
            (scaleBase * 25) + (Math.random() - 0.5) * (scaleBase * 2), 
            Math.sin(deg) * dist, 
            Math.random() * 0.8
        ));
    }
}

function switchColor() {
    currentThemeIndex = (currentThemeIndex + 1) % colorThemes.length;
    heartParticles.forEach(p => p.updateColor());
    galaxyParticles.forEach(p => p.updateColor());
}

window.addEventListener('mousedown', switchColor);
window.addEventListener('touchstart', (e) => {
    e.preventDefault();
    switchColor();
}, { passive: false });

function drawEnglishText() {
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    const baseY = height * 0.85; 
    const fontSize = Math.max(14, scaleBase * 3);
    ctx.font = `300 ${fontSize}px 'Segoe UI', Roboto, Arial`;
    ctx.letterSpacing = "2px";
    ctx.fillText("HAPPY VALENTINE'S DAY", width / 2, baseY);
}

function animate() {
    ctx.globalCompositeOperation = 'source-over';
    // 稍微加深背景覆蓋，減少發光過載造成的死白
    ctx.fillStyle = 'rgba(0, 0, 0, 0.18)'; 
    ctx.fillRect(0, 0, width, height);
    ctx.globalCompositeOperation = 'lighter';

    angleY += 0.012;

    galaxyParticles.forEach(p => p.draw(angleY * 0.3));
    heartParticles.forEach(p => p.draw(-angleY));

    drawEnglishText();
    requestAnimationFrame(animate);
}

window.addEventListener('resize', init);
init();
animate();
</script>
</body>
</html>
