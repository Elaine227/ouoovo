<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Heart Galaxy - Valentine's Special</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height;
let heartParticles = [];
let galaxyParticles = [];
let angleY = 0;

// 色彩方案：深粉、亮粉、純白
const colors = ['#ff0a54', '#ff477e', '#ff7096', '#ff85a1', '#fbb1bd', '#ffffff'];

class Particle {
    constructor(x, y, z, color, size) {
        this.x = x;
        this.y = y;
        this.z = z;
        this.color = color;
        this.size = size;
    }

    draw(rotY) {
        // 3D 旋轉矩陣
        let cosY = Math.cos(rotY);
        let sinY = Math.sin(rotY);
        let xz = this.x * cosY - this.z * sinY;
        let zz = this.x * sinY + this.z * cosY;

        // 透視投影
        const perspective = 700;
        const scale = perspective / (perspective + zz + 400);
        const screenX = xz * scale + width / 2;
        const screenY = this.y * scale + height / 2;

        // 根據深度調整透明度
        ctx.globalAlpha = Math.min(1, Math.max(0.1, scale * 0.9));
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(screenX, screenY, this.size * scale, 0, Math.PI * 2);
        ctx.fill();
    }
}

function init() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    heartParticles = [];
    galaxyParticles = [];

    // 1. 建立高密度立體愛心 (更加凝聚)
    for (let i = 0; i < 4500; i++) {
        let t = Math.random() * Math.PI * 2;
        // 增加一個隨機的厚度因子，使粒子分佈更具備體積感，而不只是表面
        let r_offset = Math.random() * 0.15 + 0.85; 
        
        const r = 14; 
        let x = r * 16 * Math.pow(Math.sin(t), 3) * r_offset;
        let y = -r * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * r_offset;
        // Z 軸分佈調整，使其呈現圓潤的立體球感
        let z = (Math.random() - 0.5) * 120 * Math.sin(t); 

        heartParticles.push(new Particle(x, y, z, colors[Math.floor(Math.random() * colors.length)], Math.random() * 1.8 + 0.5));
    }

    // 2. 建立底部星盤 (Galaxy Ring)
    for (let i = 0; i < 1500; i++) {
        let dist = Math.random() * 450 + 150;
        let deg = Math.random() * Math.PI * 2;
        galaxyParticles.push(new Particle(
            Math.cos(deg) * dist, 
            220 + (Math.random() - 0.5) * 20, 
            Math.sin(deg) * dist, 
            '#ffffff', 
            Math.random() * 0.8
        ));
    }
}

function drawEnglishText() {
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    
    // 將文字放在愛心下方，並保持間距
    const baseY = height / 2 + 250; 
    
    ctx.letterSpacing = "4px";
    ctx.font = "300 28px 'Segoe UI', Roboto, Arial";
    ctx.fillText("HAPPY VALENTINE'S DAY", width / 2, baseY);
    
    
}

function animate() {
    // 增加一點動態模糊感
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
    ctx.fillRect(0, 0, width, height);
    ctx.globalCompositeOperation = 'lighter';

    angleY += 0.012;

    // 繪製星盤
    galaxyParticles.forEach(p => p.draw(angleY * 0.3));

    // 繪製愛心 (反向自轉)
    heartParticles.forEach(p => p.draw(-angleY));

    // 繪製文字
    drawEnglishText();

    requestAnimationFrame(animate);
}

window.addEventListener('resize', init);
init();
animate();
</script>
</body>
</html>
